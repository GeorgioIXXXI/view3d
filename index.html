<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>3D-просмотр</title>
<style>
  html, body { margin: 0; height: 100%; background: #f4f1ec; font-family: Arial, Helvetica, sans-serif; overflow: hidden; }
  #s { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center;
       padding: 24px; color: #6b6558; font-size: 16px; line-height: 1.5; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
</style></head><body>
<div id="s">Загрузка…</div>
<script>
// Внутри Telegram: развернуть на весь экран и не закрывать окно вертикальным жестом — им крутят модель.
(function () {
  var t = document.createElement("script");
  t.async = true;
  t.src = "https://telegram.org/js/telegram-web-app.js";
  t.onload = function () {
    try {
      var w = window.Telegram && window.Telegram.WebApp;
      if (!w || !w.initData) return;
      w.ready(); w.expand();
      if (w.disableVerticalSwipes) w.disableVerticalSwipes();
    } catch (e) {}
  };
  document.head.appendChild(t);
})();
(async function () {
  var st = document.getElementById("s");
  function hex(h) { var a = new Uint8Array(h.length / 2); for (var i = 0; i < a.length; i++) a[i] = parseInt(h.substr(i * 2, 2), 16); return a; }
  try {
    var q = new URLSearchParams(location.search), h = new URLSearchParams(location.hash.replace(/^#/, ""));
    var parts = (q.get("v") || h.get("v") || "").split(".");
    if (!/^[0-9a-f]{12}$/.test(parts[0] || "") || !/^[0-9a-f]{64}$/.test(parts[1] || ""))
      throw new Error("Ссылка неполная. Откройте её целиком — так, как вам её прислали.");
    if (!window.crypto || !crypto.subtle || !window.DecompressionStream)
      throw new Error("Этот браузер слишком старый для просмотра. Откройте ссылку в Chrome, Safari или Яндекс Браузере.");
    var r = await fetch("d/" + parts[0] + ".bin", { cache: "no-cache" });
    if (!r.ok) throw new Error("Материал не найден или снят с публикации.");
    var total = +r.headers.get("Content-Length") || 0, got = 0, chunks = [], reader = r.body.getReader();
    for (;;) {
      var step = await reader.read();
      if (step.done) break;
      chunks.push(step.value); got += step.value.length;
      st.textContent = "Загрузка… " + (total ? Math.round(got / total * 100) + " %" : (got / 1048576).toFixed(1) + " МБ");
    }
    var buf = new Uint8Array(got), o = 0;
    chunks.forEach(function (c) { buf.set(c, o); o += c.length; });
    st.textContent = "Открываю…";
    var key = await crypto.subtle.importKey("raw", hex(parts[1]), "AES-GCM", false, ["decrypt"]);
    var plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: buf.subarray(0, 12) }, key, buf.subarray(12));
    var html = await new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream("gzip"))).blob();
    var frame = document.createElement("iframe");
    frame.src = URL.createObjectURL(new Blob([html], { type: "text/html" }));
    frame.setAttribute("allow", "fullscreen");
    document.body.replaceChildren(frame);
  } catch (e) {
    st.textContent = (e && e.name === "OperationError") ? "Ссылка не подходит к этому материалу." : (e && e.message) || "Не удалось открыть.";
  }
})();
</script></body></html>
